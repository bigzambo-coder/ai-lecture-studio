services:
  - type: web
    name: ai-lecture-slide-master
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: BACKEND_API_TOKEN
        generateValue: true
      - key: JOB_DATA_ROOT
        value: /data/jobs
